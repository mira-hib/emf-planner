name: Build EMF Planner

on:
  push:
    branches: [main, "build-validation/**"]
    tags: ["v*"]
  workflow_dispatch:

# Validation artifacts only; never create or publish a release.
permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-x64
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: nsis,msi
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows-arm64
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux-arm64
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    name: Build and validate (${{ matrix.label }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Build and retain all validation results
        env:
          CARGO_INCREMENTAL: "0"
        run: python scripts/validate-build.py --install --browser chromium --label "${{ matrix.label }}" --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Upload builds, logs and complete test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emf-validation-${{ matrix.label }}
          path: test validation/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
